<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>TTracker – Search</title>
    <style>
        body { font-family: sans-serif; margin: 2rem; }
        .autocomplete-box { border:1px solid #ccc; width:260px; display:none; position:absolute; background:white; z-index:10; }
        .autocomplete-item { padding:8px; cursor:pointer; border-bottom:1px solid #eee; }
        .autocomplete-item:hover { background:#f0f0f0; }
        input { padding:8px; width:260px; }
        .field-container { margin-bottom: 2rem; position:relative; }
        h3 { margin-top: 3rem; }
    </style>
</head>
<body>

<h2>TTracker</h2>

<!-- ------------------------------ -->
<!--  SECTION 1: SEARCH SINGLE STOP -->
<!-- ------------------------------ -->

<h3>Search a Stop</h3>

<div class="field-container">
    <input type="text" id="singleBox" placeholder="Type stop name...">
    <div id="singleResults" class="autocomplete-box"></div>
</div>
<button id="singleSearchBtn">Search Stop</button>
<!-- ------------------------------ -->
<!--  SECTION 2: SEARCH BETWEEN TWO -->
<!-- ------------------------------ -->

<h3>Find Lines Between Two Stops</h3>

<div class="field-container">
    <input type="text" id="fromBox" placeholder="From stop...">
    <div id="fromResults" class="autocomplete-box"></div>
</div>

<div class="field-container">
    <input type="text" id="toBox" placeholder="To stop...">
    <div id="toResults" class="autocomplete-box"></div>
</div>

<button id="searchBtn">Search Route</button>

<script>

    // Generic autocomplete setup
    async function setupAutocomplete(inputId, resultsId, onSelect) {
        const input = document.getElementById(inputId);
        const results = document.getElementById(resultsId);

        input.addEventListener("input", async () => {
            const q = input.value.trim();
            if (q.length < 2) {
                results.style.display = "none";
                return;
            }

            const res = await fetch(`/api/stops?name=${q}`);
            if (!res.ok) return;

            const data = await res.json();
            results.innerHTML = "";
            results.style.display = "block";

            data.forEach(stop => {
                const div = document.createElement("div");
                div.className = "autocomplete-item";
                div.textContent = `${stop.name} (${stop.id})`;
                div.onclick = () => {
                    input.value = stop.name;
                    results.style.display = "none";
                    onSelect(stop);
                };
                results.appendChild(div);
            });
        });

        document.addEventListener("click", (e) => {
            if (!results.contains(e.target) && e.target !== input) {
                results.style.display = "none";
            }
        });
    }

    // ------------------------------
    // Single stop search
    // ------------------------------

    setupAutocomplete("singleBox", "singleResults", stop => {
        window.location.href = `/stop?stopId=${stop.id}&stopName=${encodeURIComponent(stop.name)}`;
    });
    let selectedSingle = null;

// Update autocomplete to store selected stop
setupAutocomplete("singleBox", "singleResults", stop => {
    selectedSingle = stop;
    window.location.href = `/stop?stopId=${stop.id}&stopName=${encodeURIComponent(stop.name)}`;
});

    // Search button logic
    document.getElementById("singleSearchBtn").onclick = async () => {
        const q = singleBox.value.trim();
        if (q.length < 2) {
            alert("Please type at least 2 characters");
            return;
        }

        // If user typed but didn't click a suggestion → fetch first match
        if (!selectedSingle) {
            const res = await fetch(`/api/stops?name=${q}`);
            if (!res.ok) return;

            const data = await res.json();
            if (data.length === 0) {
                alert("No stops found");
                return;
            }
            selectedSingle = data[0];
        }

        window.location.href =
            `/stop?stopId=${selectedSingle.id}&stopName=${encodeURIComponent(selectedSingle.name)}`;
    };

    // ------------------------------
    // From → To search
    // ------------------------------

    let selectedFrom = null;
    let selectedTo = null;

    setupAutocomplete("fromBox", "fromResults", stop => selectedFrom = stop);
    setupAutocomplete("toBox", "toResults", stop => selectedTo = stop);

    document.getElementById("searchBtn").onclick = () => {
        if (!selectedFrom || !selectedTo) {
            alert("Please select both stops.");
            return;
        }

        window.location.href =
            `/linesBetweenTwoStops?stopIdA=${selectedFrom.id}&stopIdB=${selectedTo.id}`;
    };

</script>

</body>
</html>
