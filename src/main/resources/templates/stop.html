<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Bus Timings</title>
    <style>
        body { font-family: sans-serif; margin: 1rem; }
        table { border-collapse: collapse; width: 100%; margin-top: 1rem; }
        th, td { border: 1px solid #ddd; padding: 0.5rem; }
        th { background: #f3f3f3; }
        #results div { padding: 6px; cursor: pointer; border-bottom: 1px solid #eee; }
        #results div:hover { background: #f0f0f0; }
    </style>
</head>
<body>

<h2>Search Stop</h2>

<input type="text" id="searchBox" placeholder="Type stop name..." style="width: 250px; padding: 6px;">
<div id="results" style="border:1px solid #ccc; width:250px; display:none;"></div>

<script>
    const searchBox = document.getElementById("searchBox");
    const results = document.getElementById("results");

    searchBox.addEventListener("input", async () => {
        const q = searchBox.value.trim();
        if (q.length < 2) {
            results.style.display = "none";
            return;
        }

        const res = await fetch(`/api/stops?name=${q}`);
        if (!res.ok) return;

        const data = await res.json();
        results.innerHTML = "";
        results.style.display = "block";

        data.forEach(stop => {
            const div = document.createElement("div");
            div.textContent = `${stop.name} (${stop.id})`;
            div.onclick = () => {
                window.location.href = `/stop?stopId=${stop.id}`;
            };
            results.appendChild(div);
        });
    });
</script>

<hr>

<h2 th:text="'Stop: ' + ${stopId} + ' ' + ${stopName}"></h2>

<table>
    <thead>
    <tr>
        <th>Line</th>
        <th>Towards</th>
        <th>Type</th>
        <th>In (min)</th>
    </tr>
    </thead>

    <tbody id="arrivals-body">
    <tr th:each="a : ${arrivals}">
        <td th:text="${a.lineId}"></td>

        <td th:text="${a.lineDetails['route_type']}"></td>
        <td th:text="${a.arrivalInMinutes}"></td>
    </tr>
    </tbody>
</table>

</html>
