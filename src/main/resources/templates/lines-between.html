<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Lines Between Stops</title>
    <style>
        body { font-family: sans-serif; margin: 2rem; }
        table { border-collapse: collapse; width: 100%; margin-top: 1rem; }
        th, td { border: 1px solid #ddd; padding: 0.5rem; }
        th { background: #f3f3f3; }
        button { padding: 8px 14px; cursor: pointer; margin-bottom: 1rem; }
    </style>
</head>
<body>

<button onclick="window.location.href='/'">← Back</button>

<h2 th:text="'Lines between ' + ${stopAName} + ' and ' + ${stopBName}"></h2>

<table>
    <thead>
    <tr>
        <th>Line</th>
        <th>Destination</th>
        <th>Type</th>
    </tr>
    </thead>

    <tbody>
    <tr th:each="l : ${lines}"
    th:attr="onclick=|window.location.href='/routeTimePage?stopId=${stopIdA}&routeId=${l.lineId}&towards=${l.towards}'|"
    style="cursor:pointer;">
    
    <td th:text="${l.lineId}"></td>
    <td th:text="${l.towards}"></td>
    <td th:text="${l.lineDetails['route_type']}"></td>
</tr>




    
    </tbody>
</table>

</body>
</html>
