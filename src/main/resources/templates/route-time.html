<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Route Timings</title>
    <style>
        body { font-family: sans-serif; margin: 2rem; }
        table { border-collapse: collapse; width: 100%; margin-top: 1rem; }
        th, td { border: 1px solid #ddd; padding: 0.5rem; }
        th { background: #f3f3f3; }
        tr:hover { background: #f0f0f0; }
        button { padding: 8px 14px; cursor: pointer; margin-bottom: 1rem; }
    </style>
</head>
<body>

<button onclick="window.location.href='/'">← Back</button>

<h2 th:text="'Line ' + ${routeId} + ' → ' + ${towards}"></h2>

<table>
    <thead>
        <tr>
            <th>Stop</th>
            <th>Arrival (min)</th>
            <th>Type</th>
        </tr>
    </thead>

    <tbody>
        <tr th:each="t : ${timings}">
            <td th:text="${t.stopName}"></td>
            <td th:text="${t.arrivalInMinutes}"></td>
            <td th:text="${t.lineDetails['route_type']}"></td>
        </tr>
    </tbody>
</table>

</body>
</html>
