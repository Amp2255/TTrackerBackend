<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Bus Timings</title>
    <style>
        body { font-family: sans-serif; margin: 1rem; }
        table { border-collapse: collapse; width: 100%; margin-top: 1rem; }
        th, td { border: 1px solid #ddd; padding: 0.5rem; }
        th { background: #f3f3f3; }
        button { padding: 8px 14px; margin-bottom: 1rem; cursor: pointer; }
    </style>
</head>
<body>

<!-- Back button -->
<button onclick="window.location.href='/'">← Back</button>

<!-- Stop title -->
<h2 th:text="'Stop: ' + ${stopName}"></h2>

<table>
    <thead>
    <tr>
        <th>Line</th>
        <th>Towards</th>
        <th>Type</th>
        <th>In (min)</th>
    </tr>
    </thead>

    <tbody id="arrivals-body">
    <tr th:each="a : ${arrivals}">
        <td th:text="${a.lineId}"></td>
        <td th:text="${a.towards}"></td>
        <td th:text="${a.lineDetails['route_type']}"></td>
        <td th:text="${a.arrivalInMinutes}"></td>
    </tr>
    </tbody>
</table>

<script>
    const stopId = /*[[${stopId}]]*/ '';
    let timer = null;

    function getRefreshInterval(min) {
        if (min == null) return 30000;
        if (min > 10) return 30000;
        if (min > 5) return 20000;
        if (min > 2) return 10000;
        return 5000;
    }

    async function refresh() {
        const res = await fetch(`/api/lines?stopId=${stopId}`);
        if (!res.ok) return;

        const data = await res.json();
        const tbody = document.getElementById('arrivals-body');
        tbody.innerHTML = '';

        data.forEach(a => {
            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td>${a.lineId ?? ''}</td>
                <td>${a.towards ?? ''}</td>
                <td>${a.lineDetails?.route_type_label ?? ''}</td>
                <td>${a.arrivalInMinutes ?? '-'}</td>
            `;
            tbody.appendChild(tr);
        });

        const next = data.length ? data[0].arrivalInMinutes : 15;
        const interval = getRefreshInterval(next);

        clearTimeout(timer);
        timer = setTimeout(refresh, interval);
    }

    refresh();
</script>

</body>
</html>
